openapi: 3.2.0
info:
  title: Marqo REST Models API
  version: '2.26'
  summary: Open-source multimodal vector search engine REST API.
  description: 'Marqo is an open-source vector search engine that bundles index storage

    (Vespa) and embedding inference (Sentence Transformers, OpenCLIP, ONNX)

    behind a single FastAPI HTTP surface.'
  contact:
    name: Marqo
    url: https://www.marqo.ai
  license:
    name: Apache 2.0
    url: https://github.com/marqo-ai/marqo/blob/mainline/LICENSE
servers:
- url: http://localhost:8882
  description: Default Marqo open-source engine endpoint
- url: https://api.marqo.ai
  description: Marqo Cloud endpoint (bearer authentication)
security: []
tags:
- name: Models
  description: Inspect, load, and eject embedding models from the engine.
paths:
  /models:
    get:
      tags:
      - Models
      summary: List Loaded Models
      operationId: listModels
      responses:
        '200':
          description: Currently loaded embedding models.
  /models/eject:
    delete:
      tags:
      - Models
      summary: Eject Model
      operationId: ejectModel
      parameters:
      - in: query
        name: model_name
        required: true
        schema:
          type: string
      - in: query
        name: model_device
        required: false
        schema:
          type: string
          enum:
          - cpu
          - cuda
      responses:
        '200':
          description: Model ejected from memory.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Marqo Cloud API key passed as `Authorization: Bearer {api_key}`.

        The open-source engine accepts unauthenticated requests by default.

        '
